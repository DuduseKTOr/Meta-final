name: Validate PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required PWA files
        shell: bash
        run: |
          set -euo pipefail
          required=(index.html manifest.json sw.js)
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Arquivo obrigatório ausente: $file"; exit 1; }
          done

      - name: Validate manifest JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          required = ('name', 'short_name', 'start_url', 'display', 'icons')
          missing = [key for key in required if key not in manifest]
          if missing:
              raise SystemExit(f'Campos obrigatórios ausentes no manifest.json: {missing}')
          if not manifest['icons']:
              raise SystemExit('manifest.json precisa ter pelo menos um ícone')
          print('manifest.json OK')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8-sig')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.IGNORECASE | re.DOTALL)
          if not scripts:
              raise SystemExit('Nenhum bloco JavaScript encontrado em index.html')

          Path('/tmp/app-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          print(f'{len(scripts)} bloco(s) JavaScript encontrado(s)')
          PY
          node --check /tmp/app-inline.js
          node --check sw.js

      - name: Validate service worker shell references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          sw = Path('sw.js').read_text(encoding='utf-8')
          match = re.search(r'const\s+SHELL_FILES\s*=\s*\[(.*?)\];', sw, re.DOTALL)
          if not match:
              raise SystemExit('SHELL_FILES não encontrado em sw.js')

          files = re.findall(r"['\"](\.\/[^'\"]+)['\"]", match.group(1))
          missing = [f for f in files if not Path(f).exists()]
          if missing:
              raise SystemExit(f'Arquivos referenciados no shell do service worker não encontrados: {missing}')

          print('Referências do service worker OK')
          PY

  build-cockpit-motorista:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Cockpit Motorista Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/cockpit-motorista/app/src/main/java/br/com/cockpitmotorista
          mkdir -p android/cockpit-motorista/app/src/main/res/values

          cat > android/cockpit-motorista/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='CockpitMotorista'
          include ':app'
          EOF

          cat > android/cockpit-motorista/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > android/cockpit-motorista/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android/cockpit-motorista/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'br.com.cockpitmotorista'
              compileSdk 35
              defaultConfig {
                  applicationId 'br.com.cockpitmotorista'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android/cockpit-motorista/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Cockpit Motorista</string></resources>
          EOF

          cat > android/cockpit-motorista/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#BE185D</item>
              <item name="android:navigationBarColor">#0A0612</item>
              <item name="android:statusBarColor">#0A0612</item>
              <item name="android:windowLightStatusBar">false</item>
            </style>
          </resources>
          EOF

          cat > android/cockpit-motorista/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@style/AppTheme" android:label="Cockpit Motorista" android:usesCleartextTraffic="false" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > android/cockpit-motorista/app/src/main/java/br/com/cockpitmotorista/MainActivity.java <<'EOF'
          package br.com.cockpitmotorista;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView web;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              web = new WebView(this);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setSupportMultipleWindows(true);
              s.setJavaScriptCanOpenWindowsAutomatically(true);
              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient());
              setContentView(web);
              web.loadUrl("https://dudusektor.github.io/Meta-final/index.html");
            }
            @Override public void onBackPressed() {
              if (web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF

          cd android/cockpit-motorista
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.9-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon

      - name: Upload Cockpit Motorista APK
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-motorista-debug
          path: android/cockpit-motorista/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
