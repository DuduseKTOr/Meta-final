name: Build Cockpit Scanner debug APK

on:
  pull_request:
    paths:
      - 'android/cockpit-scanner/**'
      - '.github/workflows/cockpit-scanner-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/cockpit-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-scanner-debug-apk
          path: android/cockpit-scanner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
